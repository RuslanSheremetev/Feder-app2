name: Build Feder Compose
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
        log-accepted-android-sdk-licenses: false

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Validate Secrets
      run: |
        test -n "${{ secrets.KEY_ALIAS }}" || { echo "::error::KEY_ALIAS is empty"; exit 1; }
        test -n "${{ secrets.KEYSTORE_BASE64 }}" || { echo "::error::KEYSTORE_BASE64 is empty"; exit 1; }
        test -n "${{ secrets.KEYSTORE_PASSWORD }}" || { echo "::error::KEYSTORE_PASSWORD is empty"; exit 1; }
        test -n "${{ secrets.KEY_PASSWORD }}" || { echo "::error::KEY_PASSWORD is empty"; exit 1; }
        echo "All 4 secrets present"

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > feder-release.keystore
        ls -la feder-release.keystore

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: gradle assembleRelease --no-daemon

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Feder-Compose-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
